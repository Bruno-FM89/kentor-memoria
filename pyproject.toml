[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kentor-memoria"
version = "1.0.0"
description = "Memória corporativa da Kentor servida a agentes de IA via MCP, com controle de acesso no backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12,<2",  # v2 renomeou FastMCP → MCPServer; fixamos a v1 (estável)
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "fastembed>=0.4",
    "streamlit>=1.40",  # interface gráfica (kentor ui)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kentor = "kentor_memoria.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "corpus: testes que precisam do acervo real (data/acervo ou KENTOR_ACERVO_DIR)",
    "llm: testes que chamam o OpenRouter (precisam de OPENROUTER_API_KEY)",
]
